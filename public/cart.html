<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-brand-title-suffix="{brand}: Your Cart">Store: Your Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<script>window.API_BASE = '';</script>
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand-logo" data-brand-name><span class="accent-letter">V</span><span class="rest-letters">ELOUR</span></a>
    <div class="nav-links"><a href="index.html">Shop</a></div>
    <div class="nav-actions">
      <a href="track-order.html" class="track-link">Track order</a>
      <a href="cart.html" class="icon-btn" title="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="badge" data-nav-cart-badge hidden>0</span>
      </a>
    </div>
  </div>
</nav>

<header class="page-header">
  <div class="container">
    <h1>Your cart</h1>
    <p>Review your picks before checking out.</p>
  </div>
</header>

<section class="page-body">
  <div class="container">
    <div class="empty-state" data-cart-empty hidden>
      Your cart is empty. <a href="index.html">Continue shopping</a>
    </div>
    <div class="layout-split">
      <div data-cart-list></div>
      <aside class="summary-card" data-cart-summary hidden>
        <h3>Order summary</h3>
        <div class="summary-row"><span>Subtotal</span><span data-sum-subtotal>&#8377;0</span></div>
        <div class="summary-row"><span>Shipping</span><span data-sum-shipping>Free</span></div>
        <div class="summary-row total"><span>Total</span><span data-sum-total>&#8377;0</span></div>
        <a href="checkout.html" class="btn-primary" style="justify-content:center; margin-top:14px;">Proceed to checkout</a>
      </aside>
    </div>
  </div>
</section>

<script src="js/api.js"></script>
<script src="js/brand.js"></script>
<script src="js/app.js"></script>
<script src="js/widget.js"></script>
</body>
</html>
